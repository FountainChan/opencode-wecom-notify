name: npm publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Run tests
        run: npm test

      - name: Check NPM_TOKEN expiry
        run: node scripts/check-token-expiry.js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build tarball for GitHub Release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p "/tmp/opencode-wecom-ping/src"
          cp src/index.js "/tmp/opencode-wecom-ping/src/"
          cp package.json "/tmp/opencode-wecom-ping/"
          cp README.md "/tmp/opencode-wecom-ping/"
          cp LICENSE "/tmp/opencode-wecom-ping/" 2>/dev/null || true
          tar czf "opencode-wecom-ping-${VERSION}.tar.gz" -C /tmp opencode-wecom-ping

      - name: Create GitHub Release with tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "opencode-wecom-ping-${VERSION}.tar.gz" \
            --repo "${{ github.repository }}" \
            --title "v${VERSION}" \
            --generate-notes
